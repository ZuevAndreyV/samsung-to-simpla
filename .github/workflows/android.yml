name: Android APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: bash -c "mkdir -p app/src/main && echo '<manifest package=\"com.example.sync\"/>' > app/src/main/AndroidManifest.xml && gradlectl assembleDebug || ./gradlew assembleDebug"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simpla-sync-app
        path: "**/build/outputs/apk/debug/*.apk"
