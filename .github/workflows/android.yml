name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile and Test Code
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Скачиваем исходный код из репозитория
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Шаг 2: Устанавливаем окружение Java (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Шаг 3: Автоматическая настройка Gradle (если файлов gradlew нет в репозитории)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Шаг 4: Запуск сборки без использования локального gradlew
    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    # Шаг 5: Сохраняем готовый скомпилированный APK-файл
    - name: Upload Compiled Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
