name: Android CI Build

# Сценарий запускается при каждом push-уведомлении или создании Pull Request в ветку main (master)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile and Test Code
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Скачиваем исходный код вашего Android-приложения из репозитория
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Шаг 2: Устанавливаем и настраиваем правильное окружение Java (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Шаг 3: Выдаем операционной системе Linux права на запуск исполняемого файла сборщика Gradle
    - name: Grant Execute Permissions for Gradle Wrapper
      run: chmod +x gradlew

    # Шаг 4: Запускаем полную компиляцию приложения и генерацию тестового отладочного APK-файла
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    # Шаг 5: Сохраняем готовый скомпилированный APK-файл в качестве артефакта сборки GitHub
    - name: Upload Compiled Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
